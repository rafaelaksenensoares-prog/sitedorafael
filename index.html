<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Pesca - Em Movimento</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #121212;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #game-container {
      position: relative;
      width: 800px;
      height: 500px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      border-radius: 12px;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
      cursor: crosshair;
    }

    /* UI do Jogo */
    .ui-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.65);
      padding: 10px 20px;
      border-radius: 8px;
      backdrop-filter: blur(5px);
    }

    .stat-box {
      font-size: 16px;
      font-weight: bold;
    }

    .stat-value {
      color: #2ecc71;
    }

    .status-msg {
      position: absolute;
      top: 15%;
      width: 100%;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9);
      color: #f1c40f;
    }

    .shop-panel {
      pointer-events: auto;
      background: rgba(0, 0, 0, 0.7);
      padding: 10px 15px;
      border-radius: 8px;
      display: flex;
      gap: 15px;
      justify-content: center;
      backdrop-filter: blur(5px);
    }

    button {
      background: #e67e22;
      color: white;
      border: none;
      padding: 8px 15px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }

    button:hover {
      background: #d35400;
    }

    button:active {
      transform: scale(0.95);
    }

    button:disabled {
      background: #7f8c8d;
      cursor: not-allowed;
    }

    /* Barra de Luta contra o Peixe */
    .progress-container {
      position: absolute;
      bottom: 75px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 22px;
      background: rgba(0, 0, 0, 0.6);
      border: 2px solid #fff;
      border-radius: 11px;
      overflow: hidden;
      display: none;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #e74c3c, #f1c40f, #2ecc71);
      transition: width 0.05s linear;
    }

    /* Modal do Perfil do Peixe */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      pointer-events: auto;
      backdrop-filter: blur(6px);
    }

    .fish-card {
      background: #2c3e50;
      border: 3px solid #f1c40f;
      border-radius: 12px;
      padding: 20px;
      width: 320px;
      text-align: center;
      box-shadow: 0 0 20px rgba(241, 196, 15, 0.4);
    }

    .fish-card h2 {
      color: #f1c40f;
      margin-bottom: 10px;
    }

    .fish-avatar {
      width: 120px;
      height: 120px;
      margin: 10px auto;
      background: #1a252f;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #34495e;
    }

    .fish-info {
      margin: 15px 0;
      font-size: 16px;
      line-height: 1.5;
    }

    .fish-info span {
      color: #2ecc71;
      font-weight: bold;
    }

    .btn-collect {
      background: #2ecc71;
      font-size: 16px;
      padding: 10px 25px;
      width: 100%;
    }

    .btn-collect:hover {
      background: #27ae60;
    }
  </style>
</head>
<body>

  <div id="game-container">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    
    <div class="ui-overlay">
      <div class="top-bar">
        <div class="stat-box">Dinheiro: R$ <span id="money-display" class="stat-value">0</span></div>
        <div class="stat-box">Vara Nvl: <span id="rod-level" class="stat-value">1</span></div>
        <div class="stat-box">Barco Nvl: <span id="boat-level" class="stat-value">1</span></div>
      </div>

      <div id="status-message" class="status-msg">Clique com o MOUSE na água para lançar a isca!</div>

      <div id="progress-container" class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <div class="shop-panel">
        <button id="buy-rod-btn" onclick="upgradeRod()">Aprimorar Vara (R$ 100)</button>
        <button id="buy-boat-btn" onclick="upgradeBoat()">Aprimorar Barco (R$ 300)</button>
      </div>
    </div>

    <!-- Modal do Perfil do Peixe -->
    <div id="fish-modal" class="modal-overlay">
      <div class="fish-card">
        <h2 id="modal-fish-name">Nome do Peixe</h2>
        <div class="fish-avatar">
          <canvas id="fishPreviewCanvas" width="100" height="100"></canvas>
        </div>
        <div class="fish-info">
          <p>Classe: <span id="modal-fish-class" style="color:#3498db">Comum</span></p>
          <p>Resistência: <span id="modal-fish-res" style="color:#e74c3c">Média</span></p>
          <p>Valor de Venda: <span id="modal-fish-value">R$ 0</span></p>
        </div>
        <button class="btn-collect" onclick="closeFishModal()">VENDER PEIXE</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const fishPreviewCanvas = document.getElementById('fishPreviewCanvas');
    const fishCtx = fishPreviewCanvas.getContext('2d');

    // Estado de Economia
    let money = 0;
    let rodLevel = 1;
    let boatLevel = 1;

    // Banco de Peixes
    const fishDatabase = [
      { name: "Sardinha", minBoat: 1, value: 20, resistance: 2.0, class: "Fácil", color: "#bdc3c7", shape: "small" },
      { name: "Robalo", minBoat: 1, value: 50, resistance: 3.5, class: "Médio", color: "#3498db", shape: "medium" },
      { name: "Atum", minBoat: 2, value: 150, resistance: 6.0, class: "Difícil", color: "#e74c3c", shape: "medium" },
      { name: "Peixe-Espada", minBoat: 2, value: 350, resistance: 9.0, class: "Raro", color: "#9b59b6", shape: "long" },
      { name: "Tubarão", minBoat: 3, value: 850, resistance: 14.0, class: "Lendário", color: "#34495e", shape: "shark" },
      { name: "Megalodonte", minBoat: 3, value: 2500, resistance: 22.0, class: "Mítico", color: "#f1c40f", shape: "shark" }
    ];

    // Estados do Jogo: 'READY', 'CASTING', 'WAITING', 'HOOKED', 'SHOW_MODAL'
    let gameState = 'READY';
    let currentFish = null;
    let reelProgress = 0;

    // Isca e Animações
    let lure = { x: 400, y: 450, targetY: 450 };
    let oceanSpeed = 0;
    let foamParticles = [];

    // Gerador de espuma para o barco em movimento
    for (let i = 0; i < 30; i++) {
      foamParticles.push({
        x: Math.random() * 800,
        y: 200 + Math.random() * 300,
        size: Math.random() * 4 + 1,
        speed: Math.random() * 2 + 1.5
      });
    }

    // UI
    const moneyDisplay = document.getElementById('money-display');
    const rodLevelDisplay = document.getElementById('rod-level');
    const boatLevelDisplay = document.getElementById('boat-level');
    const statusMsg = document.getElementById('status-message');
    const progressContainer = document.getElementById('progress-container');
    const progressBar = document.getElementById('progress-bar');
    const buyRodBtn = document.getElementById('buy-rod-btn');
    const buyBoatBtn = document.getElementById('buy-boat-btn');
    const fishModal = document.getElementById('fish-modal');

    // Eventos de Controle
    canvas.addEventListener('click', (e) => {
      if (gameState === 'READY') {
        const rect = canvas.getBoundingClientRect();
        const clickY = e.clientY - rect.top;
        if (clickY > 220) {
          lure.targetY = clickY;
          castLure();
        }
      }
    });

    // SISTEMA DE CLIQUE NO ESPAÇO (Puxar em Pulsos)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (gameState === 'HOOKED') {
          // Cada clique adiciona progresso com base na vara vs resistência do peixe
          const pullPower = (rodLevel * 4.5) / (currentFish.resistance * 0.7);
          reelProgress += pullPower;
          
          // Animação visual da isca dando um tranco
          lure.y += (450 - lure.y) * 0.05;
        }
      }
    });

    function castLure() {
      gameState = 'CASTING';
      lure.x = 400;
      lure.y = 450;
      statusMsg.innerText = "Lançando a isca...";
    }

    function startWaiting() {
      gameState = 'WAITING';
      statusMsg.innerText = "Navegando... aguardando o peixe morder!";
      
      const waitTime = Math.random() * 3000 + 2000;
      setTimeout(() => {
        if (gameState === 'WAITING') {
          hookFish();
        }
      }, waitTime);
    }

    function hookFish() {
      const availableFish = fishDatabase.filter(f => f.minBoat <= boatLevel);
      currentFish = availableFish[Math.floor(Math.random() * availableFish.length)];
      
      gameState = 'HOOKED';
      reelProgress = 25;
      progressContainer.style.display = 'block';
      statusMsg.innerText = `FISGOU! UM ${currentFish.name.toUpperCase()}! APERTE ESPAÇO REPETIDAMENTE!`;
    }

    function updateGame() {
      // Movimento do Barco (Animação constante da água passando)
      oceanSpeed += 0.08;
      foamParticles.forEach(p => {
        p.y += p.speed;
        if (p.y > 500) {
          p.y = 200;
          p.x = Math.random() * 800;
        }
      });

      // Lançar Isca
      if (gameState === 'CASTING') {
        lure.y += (lure.targetY - lure.y) * 0.1;
        if (Math.abs(lure.y - lure.targetY) < 5) {
          lure.y = lure.targetY;
          startWaiting();
        }
      }

      // Luta contra o Peixe (Dificuldade constante reduzindo a barra)
      if (gameState === 'HOOKED') {
        // Peixe puxa a barra para baixo continuamente
        reelProgress -= currentFish.resistance * 0.08;
        
        reelProgress = Math.max(0, Math.min(100, reelProgress));
        progressBar.style.width = `${reelProgress}%`;

        if (reelProgress >= 100) {
          showFishProfile();
        } else if (reelProgress <= 0) {
          fishEscaped();
        }
      }
    }

    function showFishProfile() {
      gameState = 'SHOW_MODAL';
      progressContainer.style.display = 'none';

      // Atualizar Textos do Modal
      document.getElementById('modal-fish-name').innerText = currentFish.name;
      document.getElementById('modal-fish-class').innerText = currentFish.class;
      document.getElementById('modal-fish-res').innerText = `${currentFish.resistance} Kg`;
      document.getElementById('modal-fish-value').innerText = `R$ ${currentFish.value}`;

      // Desenhar Avatar do Peixe
      drawFishAvatar(currentFish);

      fishModal.style.display = 'flex';
    }

    function closeFishModal() {
      money += currentFish.value;
      fishModal.style.display = 'none';
      statusMsg.innerText = `Você vendeu o ${currentFish.name} por R$ ${currentFish.value}!`;
      resetFishing();
    }

    function fishEscaped() {
      statusMsg.innerText = "O peixe escapou! Clique rápido no Espaço na próxima vez.";
      progressContainer.style.display = 'none';
      resetFishing();
    }

    function resetFishing() {
      gameState = 'READY';
      lure.y = 450;
      updateUI();
    }

    // Desenhar a Ilustração do Peixe no Modal
    function drawFishAvatar(fish) {
      fishCtx.clearRect(0, 0, 100, 100);
      fishCtx.fillStyle = fish.color;
      fishCtx.strokeStyle = '#fff';
      fishCtx.lineWidth = 2;

      fishCtx.beginPath();
      if (fish.shape === 'shark') {
        // Corpo do Tubarão
        fishCtx.ellipse(50, 50, 35, 15, 0, 0, Math.PI * 2);
        fishCtx.fill();
        // Barbatanas
        fishCtx.beginPath();
        fishCtx.moveTo(45, 35);
        fishCtx.lineTo(55, 15);
        fishCtx.lineTo(60, 35);
        fishCtx.fillStyle = fish.color;
        fishCtx.fill();
      } else if (fish.shape === 'long') {
        // Peixe Longo
        fishCtx.ellipse(50, 50, 40, 8, 0, 0, Math.PI * 2);
        fishCtx.fill();
        // Bico/Espada
        fishCtx.fillRect(10, 49, 20, 2);
      } else {
        // Peixe Padrão
        fishCtx.ellipse(50, 50, 28, 18, 0, 0, Math.PI * 2);
        fishCtx.fill();
        // Cauda
        fishCtx.beginPath();
        fishCtx.moveTo(70, 50);
        fishCtx.lineTo(88, 38);
        fishCtx.lineTo(88, 62);
        fishCtx.fill();
      }

      // Olho
      fishCtx.fillStyle = '#fff';
      fishCtx.beginPath();
      fishCtx.arc(32, 46, 4, 0, Math.PI * 2);
      fishCtx.fill();
      fishCtx.fillStyle = '#000';
      fishCtx.beginPath();
      fishCtx.arc(31, 46, 2, 0, Math.PI * 2);
      fishCtx.fill();
    }

    // Upgrades
    function upgradeRod() {
      const cost = rodLevel * 100;
      if (money >= cost) {
        money -= cost;
        rodLevel++;
        updateUI();
        statusMsg.innerText = `Vara aprimorada para o Nível ${rodLevel}! Puxada mais forte.`;
      }
    }

    function upgradeBoat() {
      const cost = boatLevel * 300;
      if (money >= cost) {
        money -= cost;
        boatLevel++;
        updateUI();
        statusMsg.innerText = `Barco aprimorado! Mais velocidade e peixes raros!`;
      }
    }

    function updateUI() {
      moneyDisplay.innerText = money;
      rodLevelDisplay.innerText = rodLevel;
      boatLevelDisplay.innerText = boatLevel;

      buyRodBtn.innerText = `Aprimorar Vara (R$ ${rodLevel * 100})`;
      buyBoatBtn.innerText = `Aprimorar Barco (R$ ${boatLevel * 300})`;

      buyRodBtn.disabled = money < (rodLevel * 100);
      buyBoatBtn.disabled = money < (boatLevel * 300);
    }

    // Renderização do Cenário em Movimento
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. Céu
      let skyGradient = ctx.createLinearGradient(0, 0, 0, 200);
      skyGradient.addColorStop(0, '#0f2027');
      skyGradient.addColorStop(1, '#203a43');
      ctx.fillStyle = skyGradient;
      ctx.fillRect(0, 0, canvas.width, 200);

      // Sol
      ctx.fillStyle = '#f39c12';
      ctx.beginPath();
      ctx.arc(400, 200, 40, 0, Math.PI * 2);
      ctx.fill();

      // 2. Oceano
      let oceanGradient = ctx.createLinearGradient(0, 200, 0, 500);
      oceanGradient.addColorStop(0, '#11998e');
      oceanGradient.addColorStop(1, '#0575e6');
      ctx.fillStyle = oceanGradient;
      ctx.fillRect(0, 200, canvas.width, 300);

      // Partículas de Espuma (Simulando o Barco Indo para Frente)
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      foamParticles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // Linhas de Ondas Deslizantes
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
      ctx.lineWidth = 2;
      for (let i = 210; i < 500; i += 25) {
        let yPos = i + (oceanSpeed * 10) % 25;
        ctx.beginPath();
        ctx.moveTo(0, yPos);
        ctx.lineTo(800, yPos);
        ctx.stroke();
      }

      // 3. Linha de Pesca e Isca
      if (gameState !== 'READY' && gameState !== 'SHOW_MODAL') {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(560, 410);
        ctx.lineTo(lure.x, lure.y);
        ctx.stroke();

        // Isca
        ctx.fillStyle = (gameState === 'HOOKED') ? currentFish.color : '#e74c3c';
        ctx.beginPath();
        ctx.arc(lure.x, lure.y, 6, 0, Math.PI * 2);
        ctx.fill();

        // Salpicos de água ao lutar
        if (gameState === 'HOOKED') {
          ctx.strokeStyle = '#fff';
          ctx.beginPath();
          ctx.arc(lure.x, lure.y, (oceanSpeed * 15) % 18, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      // 4. Barco (Primeira Pessoa)
      ctx.fillStyle = '#4a2c11';
      ctx.beginPath();
      ctx.moveTo(0, 500);
      ctx.lineTo(0, 430);
      ctx.lineTo(800, 430);
      ctx.lineTo(800, 500);
      ctx.fill();

      // Borda do Barco
      ctx.fillStyle = '#2d1a0a';
      ctx.fillRect(0, 425, 800, 10);

      // Vara de Pesca
      ctx.strokeStyle = '#e67e22';
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(720, 500);
      ctx.lineTo(560, 410);
      ctx.stroke();

      requestAnimationFrame(() => {
        updateGame();
        draw();
      });
    }

    updateUI();
    draw();
  </script>
</body>
</html>
