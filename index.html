<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu FPS em HTML (A-Frame)</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <style>
        /* Estilo da Interface UI (Barra de Vida) */
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #interface {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 999;
            color: white;
            text-shadow: 2px 2px 0 #000;
        }
        #barra-vida-fundo {
            width: 300px;
            height: 30px;
            background-color: rgba(0, 0, 0, 0.5);
            border: 3px solid black;
        }
        #barra-vida-atual {
            width: 100%;
            height: 100%;
            background-color: #00ff00; /* Vida cheia = Verde */
            transition: width 0.2s;
        }
        .mira {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 999;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="interface">
        <h2>VIDA</h2>
        <div id="barra-vida-fundo">
            <div id="barra-vida-atual"></div>
        </div>
    </div>
    <div class="mira"></div>

    <a-scene>

            <a-camera look-controls wasd-controls="acceleration: 100">

            </a-camera>
        </a-entity>

        <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#222"></a-plane>

        <a-box position="10 5 -15" width="8" height="15" depth="8" color="#555"></a-box>
        <a-box position="-15 5 -20" width="10" height="20" depth="10" color="#444"></a-box>

        <a-entity position="0 0 -10">

        <a-box id="inimigo" position="0 1 -25" width="1.5" height="2" depth="1.5" color="red"></a-box>

    </a-scene>
