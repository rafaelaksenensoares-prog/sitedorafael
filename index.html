HTML
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Meu Jogo 2D - GTA Style</title>
    <style>
        body { margin: 0; overflow: hidden; background: #222; text-align: center; color: white; font-family: sans-serif; }
        canvas { background: #7ec850; display: block; margin: 20px auto; border: 4px solid #fff; }
    </style>
</head>
<body>
    <h1>Use as setas ou WASD para mover o jogador</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Jogador
        const player = { x: 400, y: 300, size: 20, speed: 4, color: "blue" };

        // Teclas pressionadas
        const keys = {};

        window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);

        // Desenhar Elementos do Mapa
        function drawMap() {
            // Desenhar Casa (Zona da Cidade/Floresta)
            ctx.fillStyle = "#a52a2a";
            ctx.fillRect(100, 100, 80, 80); // Parede
            ctx.fillStyle = "#501010";
            ctx.beginPath();
            ctx.moveTo(90, 100);
            ctx.lineTo(140, 50);
            ctx.lineTo(190, 100);
            ctx.fill(); // Telhado

            // Desenhar Árvores (Zona da Floresta)
            drawTree(150, 400);
            drawTree(220, 450);
            drawTree(100, 480);

            // Zona do Deserto (Fundo Amarelo no lado direito)
            ctx.fillStyle = "#e6c280";
            ctx.fillRect(500, 0, 300, 600);

            // Desenhar Pirâmides (Zona do Deserto)
            drawPyramid(650, 200, 100);
            drawPyramid(600, 400, 120);
        }

        function drawTree(x, y) {
            // Tronco
            ctx.fillStyle = "#5c4033";
            ctx.fillRect(x - 5, y, 10, 20);
            // Copa
            ctx.fillStyle = "#2e8b57";
            ctx.beginPath();
            ctx.arc(x, y - 10, 20, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawPyramid(x, y, size) {
            ctx.fillStyle = "#c29b38";
            ctx.beginPath();
            ctx.moveTo(x, y - size);
            ctx.lineTo(x - size, y + size);
            ctx.lineTo(x + size, y + size);
            ctx.fill();
        }

        function update() {
            if (keys["arrowup"] || keys["w"]) player.y -= player.speed;
            if (keys["arrowdown"] || keys["s"]) player.y += player.speed;
            if (keys["arrowleft"] || keys["a"]) player.x -= player.speed;
            if (keys["arrowright"] || keys["d"]) player.x += player.speed;
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawMap();

            // Desenhar Jogador
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
