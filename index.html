<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogo 3D - GTA Style</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; background-color: #000; }
        
        /* MENU DE SELEÇÃO DE MAPAS */
        #menu {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 25, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #menu h1 { color: #fff; font-size: 36px; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 2px; }

        .map-grid { display: flex; gap: 20px; }

        .map-card {
            background: #222;
            border: 3px solid #444;
            border-radius: 12px;
            padding: 20px;
            width: 200px;
            text-align: center;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        .map-card:hover { transform: scale(1.05); border-color: #00ff88; box-shadow: 0 0 15px rgba(0, 255, 136, 0.4); }
        .map-card.floresta { background: linear-gradient(135deg, #1b4332, #2d6a4f); }
        .map-card.cidade { background: linear-gradient(135deg, #2b2d42, #4a4e69); }
        .map-card.deserto { background: linear-gradient(135deg, #7f5539, #b08968); }

        /* HUD DO JOGO */
        #hud {
            position: absolute;
            top: 15px; left: 15px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            pointer-events: none;
            display: none;
            z-index: 5;
        }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 8px; height: 8px;
            background: #00ff88;
            border: 2px solid #000;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
            z-index: 5;
        }

        #btn-voltar {
            position: absolute;
            top: 15px; right: 15px;
            padding: 10px 15px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            display: none;
            z-index: 5;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="menu">
        <h1>Escolha o Mapa para Jogar</h1>
        <div class="map-grid">
            <div class="map-card floresta" onclick="selectMap('floresta')">
                <h2>🌲 Floresta</h2>
                <p>Com Árvores e Rio</p>
            </div>
            <div class="map-card cidade" onclick="selectMap('cidade')">
                <h2>🏙️ Cidade</h2>
                <p>Casas Sólidas com Interior</p>
            </div>
            <div class="map-card deserto" onclick="selectMap('deserto')">
                <h2>🏜️ Deserto</h2>
                <p>Grandes Pirâmides</p>
            </div>
        </div>
    </div>

    <div id="hud">
        <span id="map-name">Mapa</span> | <b>WASD</b> andar | <b>Mouse</b> olhar | <b>Clique</b> atirar
    </div>
    <div id="crosshair"></div>
    <button id="btn-voltar" onclick="openMenu()">Sair para o Menu</button>

    <script>
        let scene, camera, renderer;
        let colliders = []; // Caixas de colisão
        let bullets = [];
        let gunGroup;
        let isGameActive = false;

        let yaw = 0, pitch = 0;
        const keys = {};

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(50, 100, 50);
            scene.add(sunLight);

            createImprovedGun();

            window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
            window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement === document.body) {
                    yaw -= e.movementX * 0.002;
                    pitch -= e.movementY * 0.002;
                    pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch));
                }
            });

            document.addEventListener('mousedown', (e) => {
                if (!isGameActive) return;

                if (document.pointerLockElement !== document.body) {
                    document.body.requestPointerLock();
                } else if (e.button === 0) {
                    shoot();
                }
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }

        // ARMA COM DESIGN MELHORADO
        function createImprovedGun() {
            gunGroup = new THREE.Group();

            const darkMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.3 });
            const metalMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8 });

            // Corpo Principal
            const body = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.12, 0.5), darkMat);
            body.position.set(0.2, -0.2, -0.4);
            gunGroup.add(body);

            // Cano
            const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.5), metalMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0.2, -0.16, -0.65);
            gunGroup.add(barrel);

            // Pente / Carregador
            const mag = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.2, 0.08), darkMat);
            mag.position.set(0.2, -0.28, -0.38);
            mag.rotation.x = -0.2;
            gunGroup.add(mag);

            camera.add(gunGroup);
            scene.add(camera);
        }

        // SISTEMA DE TIRO MELHORADO
        function shoot() {
            const bulletGeo = new THREE.CylinderGeometry(0.015, 0.015, 0.4);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);

            bullet.position.copy(camera.position).add(dir.clone().multiplyScalar(0.6));
            bullet.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);

            bullet.userData = { 
                velocity: dir.multiplyScalar(2.5), 
                life: 120 
            };

            scene.add(bullet);
            bullets.push(bullet);
        }

        // CONTROLE DE SELEÇÃO DE MAPAS
        function selectMap(mapType) {
            clearScene();
            isGameActive = true;

            document.getElementById('menu').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            document.getElementById('crosshair').style.display = 'block';
            document.getElementById('btn-voltar').style.display = 'block';

            camera.position.set(0, 1.7, 0);
            yaw = 0; pitch = 0;

            if (mapType === 'floresta') buildFloresta();
            else if (mapType === 'cidade') buildCidade();
            else if (mapType === 'deserto') buildDeserto();

            document.body.requestPointerLock();
        }

        function openMenu() {
            isGameActive = false;
            document.exitPointerLock();
            document.getElementById('menu').style.display = 'flex';
            document.getElementById('hud').style.display = 'none';
            document.getElementById('crosshair').style.display = 'none';
            document.getElementById('btn-voltar').style.display = 'none';
        }

        function clearScene() {
            colliders = [];
            for (let i = scene.children.length - 1; i >= 0; i--) {
                const obj = scene.children[i];
                if (obj !== camera && obj.type !== "AmbientLight" && obj.type !== "DirectionalLight") {
                    scene.remove(obj);
                }
            }
        }

        function registerCollider(mesh) {
            mesh.updateMatrixWorld();
            const box = new THREE.Box3().setFromObject(mesh);
            colliders.push(box);
        }

        // MAPA 1: FLORESTA COM RIO
        function buildFloresta() {
            document.getElementById('map-name').innerText = "Mapa: Floresta 🌲";

            const floorGeo = new THREE.PlaneGeometry(250, 250);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0x2e8b57 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Rio Cruzando a Floresta
            const riverGeo = new THREE.PlaneGeometry(20, 250);
            const riverMat = new THREE.MeshLambertMaterial({ color: 0x1e90ff });
            const river = new THREE.Mesh(riverGeo, riverMat);
            river.rotation.x = -Math.PI / 2;
            river.position.set(30, 0.05, 0);
            scene.add(river);

            // Árvores
            for (let i = 0; i < 70; i++) {
                let x = (Math.random() - 0.5) * 220;
                let z = (Math.random() - 0.5) * 220;
                // Não colocar árvore dentro do rio
                if (Math.abs(x - 30) > 12 && Math.hypot(x, z) > 6) {
                    createTree(x, z);
                }
            }
        }

        function createTree(x, z) {
            const trunkGeo = new THREE.CylinderGeometry(0.5, 0.7, 4);
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5c4033 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, 2, z);
            scene.add(trunk);
            registerCollider(trunk);

            const leavesGeo = new THREE.ConeGeometry(2.5, 6, 8);
            const leavesMat = new THREE.MeshLambertMaterial({ color: 0x006400 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.set(x, 6, z);
            scene.add(leaves);
        }

        // MAPA 2: CIDADE COM COLISÃO COMPLETA DE CASA
        function buildCidade() {
            document.getElementById('map-name').innerText = "Mapa: Cidade 🏙️";

            const floorGeo = new THREE.PlaneGeometry(250, 250);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            createSolidHouse(-15, -15);
            createSolidHouse(25, -20);
            createSolidHouse(-20, 30);
        }

        function createSolidHouse(x, z) {
            const wallMat = new THREE.MeshLambertMaterial({ color: 0xb22222 });
            const roofMat = new THREE.MeshLambertMaterial({ color: 0x501010 });

            // Parede Esquerda
            buildWallSection(x - 5, 2, z, 0.4, 4, 10, wallMat);
            // Parede Direita
            buildWallSection(x + 5, 2, z, 0.4, 4, 10, wallMat);
            // Parede Fundo
            buildWallSection(x, 2, z - 5, 10, 4, 0.4, wallMat);

            // Parede Frente com espaço de Porta
            buildWallSection(x - 3.2, 2, z + 5, 3.6, 4, 0.4, wallMat);
            buildWallSection(x + 3.2, 2, z + 5, 3.6, 4, 0.4, wallMat);

            // Telhado
            const roofGeo = new THREE.ConeGeometry(8.5, 3.5, 4);
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(x, 5.75, z);
            roof.rotation.y = Math.PI / 4;
            scene.add(roof);
        }

        function buildWallSection(x, y, z, w, h, d, mat) {
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            wall.position.set(x, y, z);
            scene.add(wall);
            registerCollider(wall);
        }

        // MAPA 3: DESERTO
        function buildDeserto() {
            document.getElementById('map-name').innerText = "Mapa: Deserto 🏜️";

            const floorGeo = new THREE.PlaneGeometry(250, 250);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0xe6c280 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            createPyramid(-35, -35, 22);
            createPyramid(40, -20, 16);
            createPyramid(0, 50, 28);
        }

        function createPyramid(x, z, size) {
            const pyrGeo = new THREE.ConeGeometry(size, size * 1.2, 4);
            const pyrMat = new THREE.MeshLambertMaterial({ color: 0xc29b38 });
            const pyramid = new THREE.Mesh(pyrGeo, pyrMat);
            pyramid.position.set(x, (size * 1.2) / 2, z);
            pyramid.rotation.y = Math.PI / 4;
            scene.add(pyramid);
            registerCollider(pyramid);
        }

        // ATUALIZAÇÃO DE JOGO E FÍSICA
        function updatePlayer() {
            if (!isGameActive) return;

            camera.rotation.order = "YXZ";
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;

            const moveSpeed = 0.18;
            let dx = 0, dz = 0;

            if (keys['w']) {
                dx -= Math.sin(yaw) * moveSpeed;
                dz -= Math.cos(yaw) * moveSpeed;
            }
            if (keys['s']) {
                dx += Math.sin(yaw) * moveSpeed;
                dz += Math.cos(yaw) * moveSpeed;
            }
            if (keys['a']) {
                dx -= Math.cos(yaw) * moveSpeed;
                dz += Math.sin(yaw) * moveSpeed;
            }
            if (keys['d']) {
                dx += Math.cos(yaw) * moveSpeed;
                dz -= Math.sin(yaw) * moveSpeed;
            }

            // Testar Colisão com Paredes usando Box3 (Bounding Box)
            const playerRadius = 0.4;
            
            // Movimento em X
            let nextPosX = camera.position.x + dx;
            let playerBoxX = new THREE.Box3(
                new THREE.Vector3(nextPosX - playerRadius, 0.2, camera.position.z - playerRadius),
                new THREE.Vector3(nextPosX + playerRadius, 1.8, camera.position.z + playerRadius)
            );

            let collideX = false;
            for (let box of colliders) {
                if (playerBoxX.intersectsBox(box)) {
                    collideX = true;
                    break;
                }
            }
            if (!collideX) camera.position.x = nextPosX;

            // Movimento em Z
            let nextPosZ = camera.position.z + dz;
            let playerBoxZ = new THREE.Box3(
                new THREE.Vector3(camera.position.x - playerRadius, 0.2, nextPosZ - playerRadius),
                new THREE.Vector3(camera.position.x + playerRadius, 1.8, nextPosZ + playerRadius)
            );

            let collideZ = false;
            for (let box of colliders) {
                if (playerBoxZ.intersectsBox(box)) {
                    collideZ = true;
                    break;
                }
            }
            if (!collideZ) camera.position.z = nextPosZ;

            // ATUALIZAR E DESTRUIR TIROS AO BATER NO CHÃO OU OBSTÁCULOS
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.add(b.userData.velocity);
                b.userData.life--;

                // Verifica colisão com o Chão (Y <= 0)
                let hitFloor = b.position.y <= 0;

                // Verifica colisão com Obstáculos
                let hitObstacle = false;
                const bulletPoint = b.position;
                for (let box of colliders) {
                    if (box.containsPoint(bulletPoint)) {
                        hitObstacle = true;
                        break;
                    }
                }

                if (hitFloor || hitObstacle || b.userData.life <= 0) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePlayer();
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
