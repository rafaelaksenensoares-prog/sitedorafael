<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Tiro 2D - Mapas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #1e1e2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 15px;
        }

        .menu-mapas {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .btn-deserto { background-color: #e1b12c; color: #222; }
        .btn-floresta { background-color: #44bd32; color: #fff; }
        .btn-cidade { background-color: #718093; color: #fff; }

        canvas {
            border: 4px solid #ffffff;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            background-color: #000;
        }
    </style>
</head>
<body>

    <h1>🎮 Selecione o Mapa</h1>

    <div class="menu-mapas">
        <button class="btn-deserto" onclick="carregarMapa('deserto')">🌵 Deserto</button>
        <button class="btn-floresta" onclick="carregarMapa('floresta')">🌲 Floresta</button>
        <button class="btn-cidade" onclick="carregarMapa('cidade')">🏢 Cidade</button>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Dados e Estruturas dos 3 Mapas
        const mapas = {
            deserto: {
                corFundo: '#edc9af', // Areia
                estruturas: [
                    { x: 150, y: 100, largura: 80, altura: 80, cor: '#c2a268', tipo: 'rocha' },
                    { x: 550, y: 120, largura: 100, altura: 60, cor: '#c2a268', tipo: 'rocha' },
                    { x: 350, y: 300, largura: 90, altura: 90, cor: '#d4ac6e', tipo: 'rocha' },
                    { x: 100, y: 350, largura: 40, altura: 40, cor: '#27ae60', tipo: 'cacto' },
                    { x: 680, y: 320, largura: 40, altura: 40, cor: '#27ae60', tipo: 'cacto' }
                ]
            },
            floresta: {
                corFundo: '#2e7d32', // Grama
                estruturas: [
                    { x: 100, y: 80, largura: 90, altura: 90, cor: '#1b5e20', tipo: 'arvore' },
                    { x: 600, y: 90, largura: 100, altura: 100, cor: '#1b5e20', tipo: 'arvore' },
                    { x: 200, y: 320, largura: 80, altura: 80, cor: '#1b5e20', tipo: 'arvore' },
                    { x: 500, y: 300, largura: 110, altura: 110, cor: '#1b5e20', tipo: 'arvore' },
                    { x: 350, y: 0, largura: 60, altura: 500, cor: '#0288d1', tipo: 'rio' } // Rio cortando o mapa
                ]
            },
            cidade: {
                corFundo: '#546e7a', // Asfalto
                estruturas: [
                    { x: 80, y: 60, largura: 180, altura: 120, cor: '#263238', tipo: 'predio' },
                    { x: 520, y: 60, largura: 200, altura: 120, cor: '#37474f', tipo: 'predio' },
                    { x: 80, y: 320, largura: 200, altura: 120, cor: '#37474f', tipo: 'predio' },
                    { x: 520, y: 320, largura: 180, altura: 120, cor: '#263238', tipo: 'predio' },
                    { x: 370, y: 200, largura: 60, altura: 100, cor: '#d32f2f', tipo: 'container' }
                ]
            }
        };

        let mapaAtual = 'deserto';

        function desenharMapa() {
            const mapa = mapas[mapaAtual];

            // 1. Limpa o canvas e desenha a cor do solo
            ctx.fillStyle = mapa.corFundo;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Desenha cada estrutura/construção do mapa
            mapa.estruturas.forEach(est => {
                ctx.fillStyle = est.cor;
                ctx.fillRect(est.x, est.y, est.largura, est.altura);

                // Borda para destacar as construções
                ctx.strokeStyle = '#00000033';
                ctx.lineWidth = 3;
                ctx.strokeRect(est.x, est.y, est.largura, est.altura);
            });
        }

        function carregarMapa(nomeMapa) {
            mapaAtual = nomeMapa;
            desenharMapa();
        }

        // Desenha o mapa inicial ao carregar a página
        desenharMapa();
    </script>
</body>
</html>
