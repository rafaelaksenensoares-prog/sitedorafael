<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>GTA 3D Primeira Pessoa</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 16px;
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="hud">
        <b>GTA 3D Primeira Pessoa</b><br>
        Controles: <b>W, A, S, D</b> para andar | <b>Setas</b> para girar a câmera<br>
        <span id="location">Mapa: Floresta</span>
    </div>

    <script>
        // 1. Configuração da Cena e Câmera (Primeira Pessoa)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Céu Azul

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 0); // Altura dos olhos (1.6m)

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // ILUMINAÇÃO
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.5);
        sunLight.position.set(10, 20, 10);
        scene.add(sunLight);

        // 2. CRIAÇÃO DOS MAPAS (Chão e Decorações)
        const obstacles = [];

        // --- ZONA 1: FLORESTA (Grama Verde com Árvores) ---
        const forestFloorGeo = new THREE.PlaneGeometry(60, 60);
        const forestFloorMat = new THREE.MeshLambertMaterial({ color: 0x2e8b57 });
        const forestFloor = new THREE.Mesh(forestFloorGeo, forestFloorMat);
        forestFloor.rotation.x = -Math.PI / 2;
        forestFloor.position.set(-60, 0, 0);
        scene.add(forestFloor);

        function createTree(x, z) {
            const trunkGeo = new THREE.CylinderGeometry(0.3, 0.4, 2);
            const trunkMat = new THREE.MeshLambertMaterial({ color: 0x5c4033 });
            const trunk = new THREE.Mesh(trunkGeo, trunkMat);
            trunk.position.set(x, 1, z);
            scene.add(trunk);

            const leavesGeo = new THREE.ConeGeometry(1.5, 3, 8);
            const leavesMat = new THREE.MeshLambertMaterial({ color: 0x006400 });
            const leaves = new THREE.Mesh(leavesGeo, leavesMat);
            leaves.position.set(x, 3.5, z);
            scene.add(leaves);

            obstacles.push({ x: x, z: z, radius: 0.8 });
        }

        // Criar Várias Árvores na Floresta
        createTree(-70, -10);
        createTree(-50, -15);
        createTree(-65, 10);
        createTree(-55, 18);
        createTree(-75, 5);

        // --- ZONA 2: CIDADE (Asfalto com Casa) ---
        const cityFloorGeo = new THREE.PlaneGeometry(60, 60);
        const cityFloorMat = new THREE.MeshLambertMaterial({ color: 0x444444 });
        const cityFloor = new THREE.Mesh(cityFloorGeo, cityFloorMat);
        cityFloor.rotation.x = -Math.PI / 2;
        cityFloor.position.set(0, 0, 0);
        scene.add(cityFloor);

        // Casa
        const houseGeo = new THREE.BoxGeometry(8, 5, 8);
        const houseMat = new THREE.MeshLambertMaterial({ color: 0xb22222 });
        const house = new THREE.Mesh(houseGeo, houseMat);
        house.position.set(0, 2.5, -10);
        scene.add(house);
        obstacles.push({ x: 0, z: -10, radius: 5 });

        // --- ZONA 3: DESERTO (Areia com Pirâmides) ---
        const desertFloorGeo = new THREE.PlaneGeometry(60, 60);
        const desertFloorMat = new THREE.MeshLambertMaterial({ color: 0xe6c280 });
        const desertFloor = new THREE.Mesh(desertFloorGeo, desertFloorMat);
        desertFloor.rotation.x = -Math.PI / 2;
        desertFloor.position.set(60, 0, 0);
        scene.add(desertFloor);

        function createPyramid(x, z, size) {
            const pyrGeo = new THREE.ConeGeometry(size, size * 1.2, 4);
            const pyrMat = new THREE.MeshLambertMaterial({ color: 0xc29b38 });
            const pyramid = new THREE.Mesh(pyrGeo, pyrMat);
            pyramid.position.set(x, (size * 1.2) / 2, z);
            pyramid.rotation.y = Math.PI / 4;
            scene.add(pyramid);

            obstacles.push({ x: x, z: z, radius: size * 0.8 });
        }

        createPyramid(60, -10, 8);
        createPyramid(75, 10, 5);

        // 3. MOVIMENTAÇÃO E COLISÃO
        const keys = {};
        let yaw = 0; // Rotação da câmera

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        function updatePlayer() {
            // Girar Visão (Câmera)
            if (keys['arrowleft']) yaw += 0.03;
            if (keys['arrowright']) yaw -= 0.03;
            camera.rotation.y = yaw;

            // Calcular Direção
            let moveSpeed = 0.15;
            let dx = 0;
            let dz = 0;

            if (keys['w']) {
                dx -= Math.sin(yaw) * moveSpeed;
                dz -= Math.cos(yaw) * moveSpeed;
            }
            if (keys['s']) {
                dx += Math.sin(yaw) * moveSpeed;
                dz += Math.cos(yaw) * moveSpeed;
            }
            if (keys['a']) {
                dx -= Math.cos(yaw) * moveSpeed;
                dz += Math.sin(yaw) * moveSpeed;
            }
            if (keys['d']) {
                dx += Math.cos(yaw) * moveSpeed;
                dz -= Math.sin(yaw) * moveSpeed;
            }

            // Teste de Colisão antes de mover
            let nextX = camera.position.x + dx;
            let nextZ = camera.position.z + dz;
            let canMove = true;

            for (let obs of obstacles) {
                let dist = Math.hypot(nextX - obs.x, nextZ - obs.z);
                if (dist < obs.radius) {
                    canMove = false;
                    break;
                }
            }

            if (canMove) {
                camera.position.x = nextX;
                camera.position.z = nextZ;
            }

            // Atualizar HUD de Localização
            const locText = document.getElementById('location');
            if (camera.position.x < -30) locText.innerText = "Mapa: Floresta 🌲";
            else if (camera.position.x > 30) locText.innerText = "Mapa: Deserto 🏜️";
            else locText.innerText = "Mapa: Cidade 🏙️";
        }

        // Adjust Canvas no redimensionamento
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Loop de Renderização
        function animate() {
            requestAnimationFrame(animate);
            updatePlayer();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
